<h2 mat-dialog-title>
  {{ paciente ? 'Editar paciente ' + paciente.idPaciente : 'Nuevo paciente' }}
</h2>

<form [formGroup]="formulario" (ngSubmit)="guardar()" novalidate>
  <mat-dialog-content>
    <app-errores-formulario [mensajes]="errores()" />

    <mat-form-field class="campo-completo" subscriptSizing="dynamic">
      <mat-label>Nombre completo</mat-label>
      <input matInput formControlName="nombre" maxlength="60" required cdkFocusInitial />
      <mat-error>{{ primerError(formulario.controls.nombre) }}</mat-error>
    </mat-form-field>

    <div class="fila-campos">
      <mat-form-field subscriptSizing="dynamic">
        <mat-label>Edad</mat-label>
        <input matInput type="number" formControlName="edad" min="0" max="120" step="1" required />
        <mat-error>{{ primerError(formulario.controls.edad) }}</mat-error>
      </mat-form-field>

      <mat-form-field subscriptSizing="dynamic">
        <mat-label>Habitación</mat-label>
        <input
          matInput
          type="number"
          formControlName="habitacion"
          min="1"
          max="999"
          step="1"
          required
        />
        <mat-error>{{ primerError(formulario.controls.habitacion) }}</mat-error>
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="undefined" [disabled]="enviando()">
      Cancelar
    </button>
    <button mat-flat-button type="submit" [disabled]="enviando()">
      {{ paciente ? 'Guardar cambios' : 'Registrar' }}
    </button>
  </mat-dialog-actions>
</form>
