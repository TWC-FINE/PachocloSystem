<main class="pantalla">
  <mat-card class="tarjeta" appearance="outlined">
    <div class="marca">
      <img
        class="marca-logo"
        src="logos/logo-sistema-160.png"
        width="160"
        height="160"
        alt="PachocloSystem"
      />
    </div>

    <mat-card-header class="encabezado">
      <mat-card-title>PachocloSystem</mat-card-title>
      <mat-card-subtitle>Inicie sesión para continuar</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <app-errores-formulario [mensajes]="errores()" />
      @if (errores().length === 0 && avisoCierre) {
        <div class="aviso" role="status">
          <p>{{ avisoCierre }}</p>
        </div>
      }

      <form [formGroup]="formulario" (ngSubmit)="iniciarSesion()" novalidate>
        <mat-form-field>
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" autocomplete="username" required />
          <mat-error>{{ primerError(formulario.controls.username) }}</mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            formControlName="password"
            autocomplete="current-password"
            required
            [type]="verPassword() ? 'text' : 'password'"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            [attr.aria-label]="verPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="verPassword()"
            (click)="verPassword.set(!verPassword())"
          >
            <mat-icon>{{ verPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error>{{ primerError(formulario.controls.password) }}</mat-error>
        </mat-form-field>

        <button mat-flat-button type="submit" class="enviar" [disabled]="enviando()">
          @if (enviando()) {
            <mat-spinner diameter="20" aria-label="Iniciando sesión" />
          } @else {
            Iniciar sesión
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</main>
