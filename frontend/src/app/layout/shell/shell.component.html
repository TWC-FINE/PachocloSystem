<mat-toolbar class="barra">
  @if (esMovil()) {
    <button mat-icon-button type="button" aria-label="Abrir menú" (click)="menu.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
  }
  <a class="marca" routerLink="/">
    <img class="marca-logo" src="logos/logo-sistema-160.png" width="32" height="32" alt="" />
    <span>PachocloSystem</span>
  </a>
  <span class="separador"></span>
  <button
    mat-button
    type="button"
    class="usuario"
    [attr.aria-label]="esMovil() ? 'Menú de usuario' : null"
    [matMenuTriggerFor]="menuUsuario"
  >
    <mat-icon>account_circle</mat-icon>
    @if (esMovil()) {
      <!-- Solo icono: el nombre accesible lo da aria-label. -->
    } @else if (usuario(); as u) {
      <span>{{ u.username }} · {{ etiquetaRol(u.rol) }}</span>
    } @else {
      <span>Mi cuenta</span>
    }
  </button>
  <mat-menu #menuUsuario="matMenu" xPosition="before">
    <a mat-menu-item routerLink="/cambiar-password">
      <mat-icon>password</mat-icon>
      <span>Cambiar contraseña</span>
    </a>
    <button mat-menu-item type="button" (click)="cerrarSesion()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="contenedor">
  <mat-sidenav
    #menu
    class="menu"
    [mode]="esMovil() ? 'over' : 'side'"
    [opened]="!esMovil()"
    [attr.role]="esMovil() ? 'dialog' : 'navigation'"
  >
    <mat-nav-list aria-label="Secciones">
      @for (seccion of secciones(); track seccion.ruta) {
        <a
          mat-list-item
          [routerLink]="seccion.ruta"
          routerLinkActive
          #enlace="routerLinkActive"
          [activated]="enlace.isActive"
          (click)="esMovil() && menu.close()"
        >
          <mat-icon matListItemIcon>{{ seccion.icono }}</mat-icon>
          <span matListItemTitle>{{ seccion.etiqueta }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="contenido">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
