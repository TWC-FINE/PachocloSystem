# Sirve la SPA y reenvía /api a PachocloSystem. Equivale al proxy.conf.json de
# desarrollo ("/api" -> backend): un único origen, sin CORS.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # DNS interno de Docker: el nombre se resuelve al reenviar, no al arrancar nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api http://pachoclo-api:8080;
        proxy_pass $api;
        # $http_host conserva el puerto (localhost:4200). Con $host se pierde y
        # PachocloSystem ve el Origin del navegador como otro sitio (403 de CORS).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # PachocloSystem solo confía en esta cabecera si viene de la red Docker
        # (APP_LOGIN_PROXIES_CONFIABLES) y la usa para el límite de intentos de login.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # El index nunca se cachea; los demás archivos llevan hash en el nombre.
    location = /index.html {
        expires -1;
    }

    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Fallback de la SPA: cualquier ruta del router de Angular carga index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
